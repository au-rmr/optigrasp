[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "optigrasp"
version = "0.1.0"
description = "OptiGrasp inference: suction grasp from one RGB image and an object mask"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
# Checked with torch 2.5.1 + torchvision 0.20.1 (CUDA 12.4) and numpy 1.26.4.
dependencies = ["torch>=2.0", "torchvision>=0.15", "numpy"]

[project.optional-dependencies]
test = ["pytest", "opencv-python-headless"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
optigrasp = ["LICENSE.depth_anything", "_dinov2/LICENSE"]
